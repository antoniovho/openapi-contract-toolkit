name: Generate OpenAPI sources

on:
  pull_request:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Instalar Python, uv y una versión fijada de OpenAPI Generator.
      # Configure GITHUB_TOKEN as a secret if contracts are private.

      - name: Sync contracts
        run: uv run contract-sync

      - name: Generate REST server
        run: uv run generate-source --rest-server --api api-rest
