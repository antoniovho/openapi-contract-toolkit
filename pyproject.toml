[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-contract-toolkit"
version = "0.1.0"
description = "Deterministic synchronization and generation for external OpenAPI contracts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tomlkit>=0.13,<1.0",
]

[project.scripts]
contract-sync = "tools.openapi_contracts.cli:contract_sync_main"
contract-update = "tools.openapi_contracts.cli:contract_update_main"
generate-source = "tools.openapi_contracts.cli:generate_source_main"

[tool.setuptools.packages.find]
include = ["tools*"]
